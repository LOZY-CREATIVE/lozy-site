#proj-hero{padding:8.5rem calc(var(--frame) + 2.5rem) 0;background:var(--marfim)}

.proj-back{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mar);text-decoration:none;display:inline-flex;align-items:center;gap:.5rem;margin-bottom:2rem;transition:opacity .2s}

.proj-back::before{content:'←'}

.proj-back:hover{opacity:.65}

.proj-client{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mar);margin-bottom:.75rem}

.proj-title{font-family:var(--display);font-size:clamp(2.2rem,4vw,3.6rem);font-weight:400;line-height:1;margin:0 0 1rem}

.proj-title em{font-style:normal;color:var(--mar)}

/* ═══ Página do projeto: vídeo + informações ═══
   O vídeo mantém a própria proporção (sem faixas pretas). Vertical: vídeo à esquerda e informações à direita.
   Horizontal e celular: título, vídeo e detalhes empilhados. A proporção (--ar) vem do poster/vídeo, via JS. */
#proj-main{padding:0 calc(var(--frame) + 2.5rem) 5rem;background:var(--marfim)}

.proj-layout{--ar:1.7778;display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "media" "details";gap:2rem 4.5rem;align-items:start;opacity:0;transition:opacity .5s ease}

.proj-layout.ready{opacity:1}

.proj-head{grid-area:head}

.proj-media{grid-area:media;min-width:0}

.proj-details{grid-area:details;min-width:0;max-width:640px}

.proj-video{position:relative;width:100%;aspect-ratio:var(--ar);border-radius:var(--radius);overflow:hidden;background:var(--petroleo)}

.proj-video video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border:none;background:var(--petroleo)}

.proj-layout.is-horizontal .proj-media{max-width:1280px}

.proj-layout.is-vertical{--vw:clamp(240px,calc((100vh - 14rem) * var(--ar)),520px);grid-template-columns:var(--vw) minmax(0,1fr);grid-template-areas:"media head" "media details";grid-template-rows:auto 1fr;gap:0 5rem}

.proj-layout.is-vertical .proj-head{padding-top:.5rem}

.proj-sub{font-family:var(--display);font-size:clamp(1.3rem,2vw,1.8rem);font-weight:400;line-height:1.15;color:var(--mar);margin:0 0 .5rem}

.proj-meta{margin:2rem 0 0;border-top:1px solid var(--border-strong)}

.proj-meta-row{display:flex;justify-content:space-between;gap:2rem;padding:.9rem 0;border-bottom:1px solid var(--border)}

.proj-meta-k{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mar);padding-top:.2rem}

.proj-meta-v{font-family:'Inter',sans-serif;font-size:14px;color:var(--petroleo);text-align:right;margin:0}

.proj-desc{margin-top:2rem}

.proj-desc p{font-family:'Inter',sans-serif;font-size:15px;font-weight:300;color:rgba(23,49,59,.85);line-height:1.85;margin-bottom:1.2rem;max-width:52ch}

#proj-next{padding:4rem calc(var(--frame) + 2.5rem);background:var(--marfim);text-align:center}

.proj-next-label{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mar);margin-bottom:1rem}

@media(max-width:900px){
  .proj-layout.is-vertical{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "media" "details";grid-template-rows:auto;gap:2rem 0}
  .proj-layout.is-vertical .proj-media{width:min(100%,calc((100svh - 12rem) * var(--ar)));max-width:100%}
  .proj-layout.is-vertical .proj-head{padding-top:0}
}
@media(max-width:768px){
  #proj-hero{padding:6.5rem 1.5rem 0}
  #proj-main{padding:0 1.5rem 3.5rem}
}

<script>
window.addEventListener('load',()=>{
  const pre=document.getElementById('preloader');
  if(pre)setTimeout(()=>pre.classList.add('done'),900);
});
const nav=document.getElementById('main-nav');
const navBurger=document.getElementById('navBurger');
if(navBurger&&nav){
  navBurger.addEventListener('click',()=>{
    const open=nav.classList.toggle('nav-open');
    navBurger.setAttribute('aria-expanded',open);
    document.body.classList.toggle('nav-lock',open);
  });
  nav.querySelectorAll('.nav-links a').forEach(a=>a.addEventListener('click',()=>{
    nav.classList.remove('nav-open');
    navBurger.setAttribute('aria-expanded','false');
    document.body.classList.remove('nav-lock');
  }));
}
const heroEl=document.getElementById('hero');
if(heroEl){
  window.addEventListener('scroll',()=>{
    if(window.scrollY>heroEl.offsetHeight*0.75)nav.classList.add('scrolled');
    else nav.classList.remove('scrolled');
  });
}else{
  nav.classList.add('scrolled');
}
const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target)}});
},{threshold:0.15});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
function expandPanel(el){
  document.querySelectorAll('.showcase-panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
}
function showReview(n){
  document.querySelectorAll('.review-slide').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.review-dot').forEach(d=>d.classList.remove('active'));
  document.getElementById('review-'+n).classList.add('active');
  document.querySelectorAll('.review-dot')[n-1].classList.add('active');
}

const params = new URLSearchParams(location.search);
const id = params.get('id');
const p = PROJECTS[id];
const layout = document.getElementById('projLayout');
// só mostra o que está preenchido: vazio ou texto de exemplo entre colchetes ("[Formato]") não aparece
const filled = v => { v = String(v == null ? '' : v).trim(); return v && !/^\[.*\]$/.test(v); };
function setRatio(r){
  if(!(r > 0) || layout.dataset.ratio) return;
  layout.dataset.ratio = '1';
  layout.style.setProperty('--ar', r.toFixed(4));
  layout.classList.add(r < 1 ? 'is-vertical' : 'is-horizontal', 'ready');
}
if(p){
  document.getElementById('pTitle').textContent = p.client;
  if(filled(p.title) && p.title.trim() !== p.client.trim()){
    const sub = document.getElementById('pSub'); sub.textContent = p.title; sub.hidden = false;
  }
  const meta = document.getElementById('pMeta');
  [['Categoria', p.tag], ['Ano', (p.meta.find(m => m[0] === 'Ano') || [])[1]], ['Entrega', (p.meta.find(m => m[0] === 'Entrega') || [])[1]]].forEach(function(kv){
    if(!filled(kv[1])) return;
    const row = document.createElement('div'); row.className = 'proj-meta-row';
    const k = document.createElement('dt'); k.className = 'proj-meta-k'; k.textContent = kv[0];
    const v = document.createElement('dd'); v.className = 'proj-meta-v'; v.textContent = kv[1];
    row.appendChild(k); row.appendChild(v); meta.appendChild(row); meta.hidden = false;
  });
  if(filled(p.desc)){
    const d = document.getElementById('pDesc');
    String(p.desc).split(/\n{2,}/).forEach(function(par){ const el = document.createElement('p'); el.textContent = par.trim(); d.appendChild(el); });
    d.hidden = false;
  }
  document.getElementById('pDetails').hidden = !(meta.children.length || filled(p.desc));
  const pVideo = document.getElementById('pVideo');
  const posterUrl = 'assets/videos/projects/'+id+'-poster.jpg?v='+Date.now();
  pVideo.src = 'assets/videos/projects/'+id+'.mp4';
  pVideo.poster = posterUrl;
  document.title = p.client + ' — Lozy Creative';
  // a proporção vem do poster (chega primeiro) e é confirmada pelo vídeo
  const img = new Image();
  img.onload = function(){ setRatio(img.naturalWidth / img.naturalHeight); };
  img.src = posterUrl;
  pVideo.addEventListener('loadedmetadata', function(){ setRatio(pVideo.videoWidth / pVideo.videoHeight); });
  setTimeout(function(){ setRatio(16 / 9); }, 1500);
} else {
  document.getElementById('pTitle').textContent = 'Projeto não encontrado';
  setRatio(16 / 9);
}
