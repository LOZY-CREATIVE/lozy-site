#proj-hero{padding:8.5rem calc(var(--frame) + 2.5rem) 0;background:var(--sand)}

.proj-back{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--terra);text-decoration:none;display:inline-flex;align-items:center;gap:.5rem;margin-bottom:2rem;transition:opacity .2s}

.proj-back::before{content:'←'}

.proj-back:hover{opacity:.65}

.proj-client{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mid);margin-bottom:.75rem}

.proj-title{font-family:'Montserrat',sans-serif;font-size:clamp(2.2rem,5vw,4.2rem);font-weight:200;line-height:1.06;margin-bottom:2.5rem}

.proj-title em{color:var(--wine)}

#proj-video-wrap{padding:0 var(--frame) 4rem;background:var(--sand)}

.proj-video{position:relative;padding-bottom:56.25%;height:0;border-radius:var(--radius);overflow:hidden;background:var(--ink)}

.proj-video video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border:none;background:#000}

#proj-body{padding:5rem calc(var(--frame) + 2.5rem) 7rem;background:var(--sand)}

.proj-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:6rem;align-items:start}

.proj-desc p{font-family:'Inter',sans-serif;font-size:15px;font-weight:300;color:var(--mid);line-height:1.9;margin-bottom:1.4rem}

.proj-meta{border-top:1px solid var(--border-strong)}

.proj-meta-row{display:flex;justify-content:space-between;padding:.9rem 0;border-bottom:1px solid var(--border)}

.proj-meta-k{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--terra)}

.proj-meta-v{font-family:'Inter',sans-serif;font-size:13px;color:var(--ink)}

#proj-next{padding:4rem calc(var(--frame) + 2.5rem);background:var(--sand-dark);text-align:center}

.proj-next-label{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);margin-bottom:1rem}

@media(max-width:768px){
  #proj-hero{padding:6.5rem 1.5rem 0}
  #proj-body{padding:3rem 1.5rem 5rem}
  .proj-grid{grid-template-columns:1fr;gap:2.5rem}
}

window.addEventListener('load',()=>{
  const pre=document.getElementById('preloader');
  if(pre)setTimeout(()=>pre.classList.add('done'),900);
});
const nav=document.getElementById('main-nav');
const navBurger=document.getElementById('navBurger');
if(navBurger&&nav){
  navBurger.addEventListener('click',()=>{
    const open=nav.classList.toggle('nav-open');
    navBurger.setAttribute('aria-expanded',open);
    document.body.classList.toggle('nav-lock',open);
  });
  nav.querySelectorAll('.nav-links a').forEach(a=>a.addEventListener('click',()=>{
    nav.classList.remove('nav-open');
    navBurger.setAttribute('aria-expanded','false');
    document.body.classList.remove('nav-lock');
  }));
}
const heroEl=document.getElementById('hero');
if(heroEl){
  window.addEventListener('scroll',()=>{
    if(window.scrollY>heroEl.offsetHeight*0.75)nav.classList.add('scrolled');
    else nav.classList.remove('scrolled');
  });
}else{
  nav.classList.add('scrolled');
}
const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target)}});
},{threshold:0.15});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
function expandPanel(el){
  document.querySelectorAll('.showcase-panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
}
function showReview(n){
  document.querySelectorAll('.review-slide').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.review-dot').forEach(d=>d.classList.remove('active'));
  document.getElementById('review-'+n).classList.add('active');
  document.querySelectorAll('.review-dot')[n-1].classList.add('active');
}
function openModal(id){
  const v=document.getElementById('modal-video');
  v.src='assets/videos/projects/'+id+'.mp4';
  v.play().catch(()=>{});
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(e){
  if(e&&e.target!==e.currentTarget)return;
  const v=document.getElementById('modal-video');
  v.pause();
  v.src='';
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
